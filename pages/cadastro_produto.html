<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-topo: #F3EFE0;            /* Creme da navbar */
            --bg-principal: #EAA9D1;       /* Fundo rosa claro */
            --bg-card: rgba(224, 182, 209, 0.6); /* Caixa central semi-transparente */
            --cor-input: #F3EFE0;        /* Cor creme dos selects e botão */
            --cor-texto-menu: #EAA9D1;     /* Rosa dos links do menu */
            --cor-texto-escuro: #D3529B;    /* Rosa escuro dos labels e texto do botão */
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-principal);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Customizada */
        .navbar-custom {
            background-color: var(--bg-topo);
            padding: 15px 40px;
            height: 90px;
        }

        .logo-cactus {
            height: 40px;
            opacity: 1;
        }

        .nav-link-custom {
            color: var(--cor-texto-menu) !important;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            margin-left: 25px;
            transition: opacity 0.2s;
        }

        .nav-link-custom:hover {
            opacity: 0.7;
        }

        /* Área Central do Formulário */
        .container-conteudo {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card-formulario {
            background-color: var(--bg-card);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.04);
        }

        /* Labels */
        .form-label {
            color: var(--cor-texto-escuro);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        /* Select Containers para customizar as setas */
        .select-wrapper {
            position: relative;
            width: 100%;
        }

        .select-custom {
            background-color: var(--cor-input);
            color: #555;
            font-weight: 500;
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            width: 100%;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            transition: box-shadow 0.2s ease;
        }

        .select-custom:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(243, 239, 224, 0.5);
        }

        /* Seta customizada fina para os selects */
        .select-wrapper::after {
            content: "";
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-65%) rotate(45deg);
            width: 10px;
            height: 10px;
            border-right: 2px solid #888;
            border-bottom: 2px solid #888;
            pointer-events: none;
        }

        /* Botão Salvar Produto (Retangular e com cantos levemente suavizados) */
        .btn-salvar {
            background-color: var(--cor-input);
            color: var(--cor-texto-escuro);
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 4px; /* Formato retangular conforme a imagem */
            padding: 12px 0;
            width: 100%;
            max-width: 320px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-salvar:hover {
            background-color: #e5e0cf;
            transform: scale(1.02);
        }

        /* Ajustes Responsivos */
        @media (max-width: 576px) {
            .navbar-custom {
                padding: 15px 20px;
                height: auto;
            }
            .nav-link-custom {
                margin-left: 15px;
                font-size: 0.85rem;
            }
            .card-formulario {
                padding: 30px 20px;
                border-radius: 16px;
            }
            .btn-salvar {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand navbar-light navbar-custom">
        <div class="container-fluid p-0 align-items-center">
            <a class="navbar-brand m-0" href="#">
                <img src="../Cactus-Jack-Logo 2.png" alt="">
            </a>
            
            <div class="navbar-nav ms-auto text-uppercase">
                <a class="nav-link nav-link-custom" href="#">Página Inicial</a>
                <a class="nav-link nav-link-custom" href="#">Usuário</a>
            </div>
        </div>
    </nav>

    <main class="container-conteudo">
        <div class="card-formulario">
            <form>
                
                <div class="mb-4">
                    <label for="nome-produto" class="form-label text-uppercase">Nome do Produto</label>
                    <div class="select-wrapper">
                        <select id="nome-produto" class="select-custom" required>
                            <option value="" disabled selected></option>
                            <option value="air-jordan-1">Air Jordan 1 Low Shy Pink</option>
                            
                        </select>
                    </div>
                </div>

                <div class="mb-5">
                    <label for="valor-produto" class="form-label text-uppercase">Valor do Produto</label>
                    <div class="select-wrapper">
                        <select id="valor-produto" class="select-custom" required>
                            <option value="" disabled selected></option>
                            <option value="1299">R$ 1.299,99</option>
                        
                        </select>
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn-salvar text-uppercase">Salvar Produto</button>
                </div>

            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
